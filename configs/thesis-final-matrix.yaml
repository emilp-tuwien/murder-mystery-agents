base:
  experiment_name: thesis-final-matrix
  output_root: outputs
  replicates: 24
  pilot_ready_runs_per_condition: 5
  interim_ready_runs_per_condition: 12
  final_ready_runs_per_condition: 24
  backend: local
  model_name: local_llm
  base_url: http://192.168.11.11:8080/v1
  temperature: 0.7
  seed: 4242
  conversations_per_round: 20
  max_rounds: 6
  stage_gate_policy: evidence_gated
  min_round_gate_conversations: 10
  max_round_gate_conversations: 24
  min_unique_question_targets_per_round: 3
  min_question_coverage_fraction_per_round: 0.5
  min_evidence_signals_per_round: 3
  min_pressure_signals_per_round: 2
  min_clue_references_per_round: 1
  min_synthesis_signals_final_round: 1
  enable_ui: false
  prompt_version: thesis-final-v2
  turn_policy_version: top2-selective-silence-v1
  memory_version: three-stage-v1
  deception_labeling_enabled: true
  deception_labeling_mode: heuristic
  scenario_id: business-of-murder-v1
  scenario_path: scenarios/business-of-murder/scenario.json
  roles_dir: scenarios/business-of-murder/roles
  clues_dir: scenarios/business-of-murder/clues
  notes: >-
    Final thesis matrix. Uses only factors that now produce real runtime differences:
    progression policy (round budget vs evidence-gated) and dialogue budget
    (standard vs extended). Memory is held constant until a second implemented
    memory policy exists, so the thesis does not claim a fake manipulation.

conditions:
  - name: round-budget__standard-budget
    description: >-
      Baseline control. Fixed round-budget progression with the current standard
      dialogue budget.
    overrides:
      stage_gate_policy: round_budget
      conversations_per_round: 20
      min_round_gate_conversations: 10
      max_round_gate_conversations: 20
    factors:
      progression_policy: round_budget
      dialogue_budget: standard
      cell_role: control

  - name: round-budget__extended-budget
    description: >-
      Dialogue-budget control. Fixed round-budget progression with more turns,
      isolating the effect of giving the discussion more space without gate logic.
    overrides:
      stage_gate_policy: round_budget
      conversations_per_round: 28
      min_round_gate_conversations: 12
      max_round_gate_conversations: 28
    factors:
      progression_policy: round_budget
      dialogue_budget: extended
      cell_role: budget_control

  - name: evidence-gated__standard-budget
    description: >-
      Primary treatment. Evidence-gated progression with the standard dialogue
      budget to test whether gating improves evidence integration and accusation quality.
    overrides:
      stage_gate_policy: evidence_gated
      conversations_per_round: 20
      min_round_gate_conversations: 10
      max_round_gate_conversations: 24
    factors:
      progression_policy: evidence_gated
      dialogue_budget: standard
      cell_role: primary_treatment

  - name: evidence-gated__extended-budget
    description: >-
      Robustness and mechanism cell. Evidence-gated progression plus more turns,
      testing whether gating still matters when the group is given a larger budget.
    overrides:
      stage_gate_policy: evidence_gated
      conversations_per_round: 28
      min_round_gate_conversations: 12
      max_round_gate_conversations: 32
    factors:
      progression_policy: evidence_gated
      dialogue_budget: extended
      cell_role: robustness_treatment
