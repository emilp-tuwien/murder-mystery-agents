base:
  experiment_name: thesis-final-matrix
  output_root: outputs
  replicates: 24
  pilot_ready_runs_per_condition: 5
  interim_ready_runs_per_condition: 12
  final_ready_runs_per_condition: 24
  backend: local
  model_name: local_llm
  base_url: http://192.168.11.11:8080/v1
  temperature: 0.7
  seed: 4242
  conversations_per_round: 20
  max_rounds: 6
  stage_gate_policy: round_budget
  min_round_gate_conversations: 10
  max_round_gate_conversations: 20
  min_unique_question_targets_per_round: 3
  min_question_coverage_fraction_per_round: 0.5
  min_evidence_signals_per_round: 3
  min_pressure_signals_per_round: 2
  min_clue_references_per_round: 1
  min_synthesis_signals_final_round: 1
  murderer_behavior_mode: passive_concealment
  enable_ui: false
  prompt_version: thesis-final-v2
  turn_policy_version: top2-selective-silence-v1
  memory_version: three-stage-v1
  deception_labeling_enabled: true
  deception_labeling_mode: llm_rubric
  deception_judge_temperature: 0.0
  deception_judge_context_before_turns: 4
  deception_judge_context_after_turns: 2
  deception_judge_max_retries: 2
  scenario_id: business-of-murder-v1
  scenario_path: scenarios/business-of-murder/scenario.json
  roles_dir: scenarios/business-of-murder/roles
  clues_dir: scenarios/business-of-murder/clues
  notes: >-
    Final thesis matrix. 2x2 design over murderer_behavior_mode
    (passive_concealment vs active_deception) and progression_policy
    (round_budget vs evidence_gated). Dialogue budget is held constant
    at the standard value across all four cells.

conditions:
  - name: passive-concealment__round-budget
    description: >-
      Control cell. Murderer receives no explicit tactic coaching and progression
      advances by fixed round budget. Establishes the baseline concealment rate
      without active deception instructions.
    overrides:
      murderer_behavior_mode: passive_concealment
      stage_gate_policy: round_budget
      max_round_gate_conversations: 20
    factors:
      murderer_behavior: passive_concealment
      progression_policy: round_budget
      cell_role: control

  - name: passive-concealment__evidence-gated
    description: >-
      Progression treatment. Murderer receives no explicit tactic coaching but
      rounds are evidence-gated, forcing more thorough questioning before
      advancement. Isolates the effect of gate structure without deception coaching.
    overrides:
      murderer_behavior_mode: passive_concealment
      stage_gate_policy: evidence_gated
      max_round_gate_conversations: 24
    factors:
      murderer_behavior: passive_concealment
      progression_policy: evidence_gated
      cell_role: gate_treatment

  - name: active-deception__round-budget
    description: >-
      Deception treatment. Murderer receives explicit coaching in named deceptive
      tactics with fixed round-budget progression. Isolates the effect of tactic
      coaching without gate structure.
    overrides:
      murderer_behavior_mode: active_deception
      stage_gate_policy: round_budget
      max_round_gate_conversations: 20
    factors:
      murderer_behavior: active_deception
      progression_policy: round_budget
      cell_role: deception_treatment

  - name: active-deception__evidence-gated
    description: >-
      Full treatment cell. Murderer receives explicit deception coaching and
      progression is evidence-gated. Tests whether gate structure reduces the
      murderer's advantage even when they are actively coached.
    overrides:
      murderer_behavior_mode: active_deception
      stage_gate_policy: evidence_gated
      max_round_gate_conversations: 24
    factors:
      murderer_behavior: active_deception
      progression_policy: evidence_gated
      cell_role: full_treatment
